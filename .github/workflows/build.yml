name: CI and Release

on:
  push:
    branches: [main, master]
    tags: ["v*", "*.*.*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.0); leave empty for automatic versioning"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: clocky-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version

  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage gate
        run: make test-coverage

      - name: Run go vet
        run: go vet ./...

  release-version:
    name: Determine release version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      create_release: ${{ steps.version.outputs.create_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            create_release=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            if [ -z "$tag" ]; then
              latest="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
              if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                patch="${BASH_REMATCH[3]}"
                tag="v${major}.${minor}.$((patch + 1))"
              else
                tag="v0.0.$RUN_NUMBER"
              fi
            elif [[ "$tag" != v* ]]; then
              tag="v$tag"
            fi
            create_release=true
          else
            latest="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
            if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              tag="v${major}.${minor}.$((patch + 1))"
            else
              tag="v0.0.$RUN_NUMBER"
            fi
            create_release=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create_release=$create_release" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          output="dist/clocky-${GOOS}-${GOARCH}${GOARM:+v${GOARM}}${{ matrix.suffix }}"
          go build -trimpath -ldflags="-s -w" -o "$output" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: clocky-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [lint, test, release-version, build]
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs.lint.result == 'success' &&
        needs.test.result == 'success' &&
        needs.release-version.result == 'success' &&
        needs.build.result == 'success' &&
        needs.release-version.outputs.create_release == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release tag when needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-version.outputs.tag }}
          name: Clocky ${{ needs.release-version.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          files: release-artifacts/*

  development-release:
    name: Publish PR development release
    needs: [lint, test, build]
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out tested merge commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Define development version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "tag=v0.0.0-dev.pr.${PR_NUMBER}.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create development release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create development prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Clocky ${{ steps.version.outputs.tag }}
          body: Development build for PR #${{ github.event.pull_request.number }} at commit ${{ github.event.pull_request.head.sha }}.
          prerelease: true
          make_latest: false
          files: release-artifacts/*
