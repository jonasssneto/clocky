{{define "result.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Clocky</title>
  <style>
    :root { color-scheme: dark; font-family: "IBM Plex Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace; background: #090d13; color: #f0f6fc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: linear-gradient(90deg, #ffffff08 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(#ffffff06 1px, transparent 1px) 0 0 / 48px 48px, radial-gradient(circle at 70% 0, #172033, #090d13 48%); }
    main { width: min(560px, 100%); border-top: 1px solid #3a4658; border-bottom: 1px solid #3a4658; padding: 34px 0; animation: enter .45s ease-out both; }
    .brand { margin: 0 0 42px; color: #f0f6fc; font-size: clamp(46px, 12vw, 76px); font-weight: 800; letter-spacing: -.08em; line-height: .8; }
    .brand span { color: #1db954; }
    .result-code { margin-bottom: 12px; color: {{if .Success}}#1db954{{else}}#ff9aa5{{end}}; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 5vw, 38px); letter-spacing: -.04em; }
    p { max-width: 480px; margin: 0; color: #9da7b3; font-size: 13px; line-height: 1.65; }
    a { display: inline-block; margin-top: 26px; padding: 12px 16px; border: 1px solid #3a4658; background: #111823; color: #f0f6fc; text-decoration: none; font-size: 12px; font-weight: 700; transition: border-color .18s, transform .18s; }
    a:hover { border-color: #1db954; transform: translateY(-2px); }
    @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body><main><p class="brand">clocky<span>.</span></p><div class="result-code">{{if .Success}}SUCCESS{{else}}ERROR{{end}}</div><h1>{{.Title}}</h1><p>{{.Message}}</p><a href="/">Return to settings</a></main></body>
</html>
{{end}}
