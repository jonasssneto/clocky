{{define "result.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Clocky</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #090d13; color: #f0f6fc; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: radial-gradient(circle at top, #172033 0, #090d13 48%); box-sizing: border-box; }
    main { width: min(440px, 100%); padding: 32px; border: 1px solid #273142; border-radius: 16px; background: #111823; text-align: center; box-shadow: 0 18px 60px #0006; }
    .mark { width: 54px; height: 54px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; background: {{if .Success}}#1db954{{else}}#da4b5a{{end}}; color: #07110b; font-size: 26px; font-weight: 850; }
    h1 { margin: 0 0 10px; font-size: 27px; } p { color: #aab4c0; line-height: 1.55; }
    a { display: inline-block; margin-top: 18px; padding: 11px 18px; border-radius: 999px; background: #263244; color: #f0f6fc; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body><main><div class="mark">{{if .Success}}✓{{else}}!{{end}}</div><h1>{{.Title}}</h1><p>{{.Message}}</p><a href="/">Return to settings</a></main></body>
</html>
{{end}}
